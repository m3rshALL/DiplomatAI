services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diplomat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/diplomat
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    command: uvicorn app.webapp.main:app --host 0.0.0.0 --port 8080
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/diplomat
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read(); print('ok')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot:
        condition: service_started
    restart: unless-stopped

  # Для Mini App нужен HTTPS. Этот сервис поднимает временный публичный HTTPS URL через trycloudflare.com
  # URL можно посмотреть в логах: docker-compose logs -f tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    # В некоторых сетях QUIC режется, из-за чего tunnel часто падает и Mini App получает ошибки Cloudflare.
    # http2 обычно стабильнее.
    command: tunnel --no-autoupdate --protocol http2 --url http://web:8080
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: .
    command: streamlit run app/admin/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/diplomat
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


volumes:
  pgdata:
